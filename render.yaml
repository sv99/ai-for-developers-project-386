# Render Blueprint: creates the web service that runs the Docker image.
# Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: calendar-slot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true

  # Go-сервер контракта typespec/http.tsp (веха 2: Postgres).
  - type: web
    name: calendar-slot-api
    runtime: go
    rootDir: server
    buildCommand: go build -tags netgo -ldflags '-s -w' -o bin/app ./cmd/server
    startCommand: ./bin/app
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calendar-slot-db
          property: connectionString
      - key: OWNER_TZ
        value: UTC
      # Фронт и API на разных origins — без этого браузер блокирует ответы
      # (нет Access-Control-Allow-Origin), в проде всё выглядит «недоступным».
      - key: CORS_ORIGINS
        value: https://calendar-slot.onrender.com

databases:
  # ⚠️ free-план: БД живёт 30 дней (затем пересоздание/апгрейд) — см. решение тикета #66.
  - name: calendar-slot-db
    databaseName: calendar
    user: calendar
    plan: free
    region: oregon
