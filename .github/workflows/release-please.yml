name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR / release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A fine-grained PAT is required here instead of the default
          # GITHUB_TOKEN: tags/releases created with GITHUB_TOKEN do not
          # trigger other workflows (e.g. release.yml on tag push).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
