name: CI

on:
  push:
    # только main: PR-ветки проверяет pull_request-запуск; push по '**' гонял
    # каждый коммит PR-ветки второй раз параллельно с pull_request-прогоном.
    branches: [main]
  pull_request:

# Новые пуши в ту же ветку отменяют устаревшие прогоны — не копим очередь.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 'Frontend: test, build, smoke'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test (app starts and responds)
        run: |
          pnpm preview --port 4173 --strictPort &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ -o page.html; then
              grep -q 'id="app"' page.html
              echo "Smoke test passed: app is up and responds"
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed: app did not respond within 30s"
          exit 1

  e2e:
    name: 'E2E: Playwright (chromium)'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  server:
    name: 'Server: lint, vet, test, build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
          version: latest

      - name: Regenerate contract stubs
        run: go tool oapi-codegen --config oapi-codegen.yaml ../docs/openapi.yaml

      - name: Generated code is up to date (guard)
        run: git diff --exit-code -- gen

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -p 1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/server
