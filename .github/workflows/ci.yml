name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: 'Frontend: test, build, smoke'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test (app starts and responds)
        run: |
          pnpm preview --port 4173 --strictPort &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ -o page.html; then
              grep -q 'id="app"' page.html
              echo "Smoke test passed: app is up and responds"
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed: app did not respond within 30s"
          exit 1

  server:
    name: 'Server: lint, vet, test, build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
          version: latest

      - name: Regenerate contract stubs
        run: go tool oapi-codegen --config oapi-codegen.yaml ../docs/openapi.yaml

      - name: Generated code is up to date (guard)
        run: git diff --exit-code -- gen

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -p 1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/server
