name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Version mismatch: package.json has $PKG_VERSION, but tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Smoke test (app starts and responds)
        run: |
          pnpm preview --port 4173 --strictPort &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ -o page.html; then
              grep -q 'id="app"' page.html
              echo "Smoke test passed: app is up and responds"
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed: app did not respond within 30s"
          exit 1

      - name: Package dist
        run: zip -r "dist-${GITHUB_REF_NAME}.zip" dist

      - name: Upload dist to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" "dist-${GITHUB_REF_NAME}.zip" --clobber
